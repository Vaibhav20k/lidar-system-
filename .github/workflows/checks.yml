name: Verify Roomform
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: pip install numpy==2.5.4 opencv-python-headless==5.0.0.93
      - run: python -m unittest discover -s scripts/scan_processing -p 'test_*.py'
      - run: python scripts/scan_processing/benchmark_structure.py verification/benchmark/synthetic.json benchmark-output
      - uses: actions/upload-artifact@v4
        with: { name: synthetic-scoring-report, path: benchmark-output }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # This runner already includes SDK 36. Avoid a second SDK download/setup.
      - run: test -d "$ANDROID_HOME/platforms/android-36"
      - run: npm ci && npm run build && npx cap sync android
      - run: chmod +x android/gradlew && android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: roomform-android-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm run build && npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
